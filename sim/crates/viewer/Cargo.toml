[package]
name = "viewer"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
env_logger = "0.11.11"
formats = { version = "0.1.0", path = "../formats" }
glam = "0.30"
log = "0.4.34"
lua = { path = "../lua" }
mlua = { version = "0.10", features = ["lua51", "vendored", "send"] }
png = "0.18.1"
pollster = "1.0.1"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = "30.0.1"
winit = "0.30.13"

[build-dependencies]
embed-resource = "3"

[[bin]]
name = "metrostroi-rs"
path = "src/main.rs"
